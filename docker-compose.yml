# ============================================================
# Machine Learning Journey — Docker Compose
# ============================================================
# Usage:
#   docker-compose up        → Start JupyterLab
#   docker-compose up api    → Start FastAPI server
#   docker-compose down      → Stop all services
# ============================================================

version: "3.9"

services:
  jupyter:
    build: .
    container_name: ml-journey-jupyter
    ports:
      - "8888:8888"
    volumes:
      - .:/app
      - ml-data:/app/datasets
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
    restart: unless-stopped

  api:
    build: .
    container_name: ml-journey-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    profiles:
      - api

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: ml-journey-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    restart: unless-stopped
    profiles:
      - mlops

volumes:
  ml-data:
  mlflow-data:
