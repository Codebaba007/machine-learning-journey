site_name: Machine Learning Journey
site_description: A comprehensive Machine Learning learning repository — from fundamentals to production.
site_author: Mehedi Hasan
site_url: https://mehedi032003.github.io/machine-learning-journey/

repo_name: Mehedi032003/machine-learning-journey
repo_url: https://github.com/Mehedi032003/machine-learning-journey

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - tags

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Roadmap: docs/roadmap.md
  - Resources: docs/resources.md
  - Cheatsheets:
    - Python: docs/cheatsheets/python.md
    - NumPy: docs/cheatsheets/numpy.md
    - Pandas: docs/cheatsheets/pandas.md
    - Matplotlib: docs/cheatsheets/matplotlib.md
    - Scikit-learn: docs/cheatsheets/sklearn.md
    - PyTorch: docs/cheatsheets/pytorch.md
  - Interview Prep: docs/interview_notes.md
  - Research Papers: docs/research_papers.md
  - Project Ideas: docs/project_ideas.md
